services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: family
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://family:${POSTGRES_PASSWORD}@db:5432/family
      COOKIE_SECURE: "true"
      APP_ORIGIN: https://family.shamilfrontend.ru
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  pgdata:
    name: family-assistant_pgdata
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
