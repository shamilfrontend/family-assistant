<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#e56b6f" />
    <meta name="theme-color" content="#e56b6f" />
    <meta name="apple-mobile-web-app-title" content="Семейный ассистент" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        const stored = localStorage.getItem("fa-theme") || "system";
        const dark =
          stored === "dark" ||
          (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Семейный ассистент</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
